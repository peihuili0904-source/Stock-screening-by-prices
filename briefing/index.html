<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

/* Layout: 한 줄 기둥(약 680px). 결론 → 시각 분포 → 밴드 → 쟁점 → 일정 → 증권사별(접힘) → 팩트체크(접힘) 순으로 위에서 아래로 훑는다.
   색: 한국 증시 관례대로 강세=빨강, 약세=파랑. 강조색(남색)은 구조에만 쓴다. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --ink: #161a22;
  --muted: #5d6573;
  --line: #e1e4ea;
  --accent: #23345c;
  --up: #d23b3b;
  --up-soft: #f8dede;
  --down: #2a63c9;
  --down-soft: #dbe6f8;
  --flat: #7b8494;
  --flat-soft: #e8eaee;
  --warn: #b7791f;
  --warn-soft: #f6ead2;
  --ok: #2f855a;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --ink: #e8ebf1; --muted: #9aa3b2; --line: #2a303b;
    --accent: #9db3e8; --up: #f06b6b; --up-soft: #3a1e22; --down: #6b9bf0; --down-soft: #1c2840;
    --flat: #8b94a4; --flat-soft: #262b35; --warn: #e0a84a; --warn-soft: #362a16; --ok: #5cc28d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b23; --ink: #e8ebf1; --muted: #9aa3b2; --line: #2a303b;
  --accent: #9db3e8; --up: #f06b6b; --up-soft: #3a1e22; --down: #6b9bf0; --down-soft: #1c2840;
  --flat: #8b94a4; --flat-soft: #262b35; --warn: #e0a84a; --warn-soft: #362a16; --ok: #5cc28d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  display: grid; gap: 40px;
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
section { display: grid; gap: 14px; min-width: 0; }
p { margin: 0; }

/* 머리말 */
.mast { display: grid; gap: 10px; }
.mast .date { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.mast h1 { font-size: 26px; line-height: 1.35; font-weight: 700; }
.mast .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.mast .meta b { color: var(--ink); font-weight: 600; }

/* 결론 3줄 */
.points { display: grid; gap: 0; border-top: 1px solid var(--line); }
.point { display: grid; grid-template-columns: 28px 1fr; gap: 4px 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.point .idx { font-family: var(--font-num); color: var(--accent); font-weight: 600; padding-top: 1px; }
.point h3 { font-size: 17px; font-weight: 600; line-height: 1.45; }
.point p { grid-column: 2; color: var(--muted); font-size: 14px; }
.who { font-size: 12px; color: var(--muted); }

/* 시각 분포 */
.stance-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
.stance-bar span { display: block; }
.stance-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; }
.stance-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.stance-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stance-col { display: grid; gap: 6px; align-content: start; }
.stance-col .hd { font-size: 12px; font-weight: 600; }
.chip { font-size: 13px; padding: 5px 9px; border-radius: 6px; line-height: 1.35; }
.chip small { display: block; font-size: 11px; opacity: .8; }
.bull .hd { color: var(--up); } .bull .chip { background: var(--up-soft); }
.neutral .hd { color: var(--flat); } .neutral .chip { background: var(--flat-soft); }
.bear .hd { color: var(--down); } .bear .chip { background: var(--down-soft); }

/* KOSPI 밴드 */
.band { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 16px 14px; display: grid; gap: 14px; }
.band-plot { position: relative; display: grid; gap: 16px; padding-top: 22px; }
.band-row { display: grid; gap: 5px; position: relative; z-index: 1; }
.band-row .lbl { font-size: 13px; font-weight: 600; width: fit-content; max-width: 100%; background: var(--surface); padding-right: 6px; position: relative; z-index: 2; }
.band-row .lbl span { font-weight: 400; color: var(--muted); font-size: 12px; }
.track { position: relative; height: 26px; }
.seg { position: absolute; height: 10px; border-radius: 3px; }
.seg.q { top: 2px; background: var(--accent); }
.seg.y { top: 14px; background: color-mix(in srgb, var(--accent) 35%, transparent); }
.dot { position: absolute; top: 9px; width: 10px; height: 10px; border-radius: 50%; transform: translateX(-50%); background: var(--accent); }
.dot.ext { background: transparent; border: 2px solid var(--accent); }
.vline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--muted); z-index: 0; }
.vline.now { border-left: 2px solid var(--up); }
.vline b { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 500; color: var(--muted); background: var(--surface); padding: 0 3px; }
.vline.now b { color: var(--up); }
.axis { position: relative; height: 16px; border-top: 1px solid var(--line); }
.axis span { position: absolute; top: 2px; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
.axis span:first-child { transform: none; }
.axis span:last-child { transform: translateX(-100%); }
.band-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.band-key i { display: inline-block; width: 18px; height: 7px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }

/* 쟁점 */
.debate { display: grid; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.debate:first-of-type { border-top: 1px solid var(--line); }
.debate h3 { font-size: 16px; font-weight: 600; }
.sides { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.side { padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; display: grid; gap: 4px; align-content: start; }
.side .who { font-weight: 600; }
.side.a { background: var(--up-soft); } .side.a .who { color: var(--up); }
.side.b { background: var(--down-soft); } .side.b .who { color: var(--down); }
.why { font-size: 13px; color: var(--muted); }

/* 일정 */
.cal { display: grid; gap: 0; }
.day { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.day .d { font-family: var(--font-num); font-weight: 600; font-size: 14px; line-height: 1.3; }
.day .d small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.day ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.day li .tag { font-size: 11px; color: var(--muted); margin-left: 4px; }
.day.key .d { color: var(--accent); }

/* 증권사별 */
details { border-bottom: 1px solid var(--line); }
details:first-of-type { border-top: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 12px 0; display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: start; }
summary::-webkit-details-marker { display: none; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
summary .bar { width: 4px; height: 100%; min-height: 36px; border-radius: 2px; }
summary .t { display: grid; gap: 2px; min-width: 0; }
summary .t b { font-size: 15px; font-weight: 600; }
summary .t span { font-size: 14px; color: var(--muted); }
summary .chev { color: var(--muted); font-size: 13px; transition: transform .15s; padding-top: 2px; }
details[open] summary .chev { transform: rotate(90deg); }
.detail { padding: 0 0 14px 18px; display: grid; gap: 6px; font-size: 14px; }
.detail .rt { font-size: 13px; color: var(--muted); }
.detail ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.stale { font-size: 11px; color: var(--warn); background: var(--warn-soft); padding: 1px 6px; border-radius: 4px; margin-left: 6px; font-weight: 500; }

/* 팩트체크 */
.fc-note { font-size: 14px; padding: 12px 14px; border-radius: 8px; background: var(--warn-soft); }
.fc { display: grid; gap: 0; }
.fc-item { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.verdict { font-size: 12px; font-weight: 600; padding: 2px 0; border-radius: 4px; text-align: center; height: fit-content; }
.v-bad { background: var(--down-soft); color: var(--down); }
.v-part { background: var(--warn-soft); color: var(--warn); }
.v-ok { background: var(--flat-soft); color: var(--ok); }
.fc-item .ev { font-size: 13px; color: var(--muted); }
.src { color: var(--accent); text-decoration: none; font-weight: 500; margin-right: 8px; }
.src:hover, .src:focus-visible { text-decoration: underline; }
.more summary { grid-template-columns: 1fr auto; font-size: 14px; color: var(--muted); }


/* 깊이 읽기 */
.deep { display: grid; gap: 12px; }
.deep details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.deep details:first-of-type { border-top: 1px solid var(--line); }
.deep summary { padding: 14px 14px; grid-template-columns: 8px 1fr auto; }
.deep .body { padding: 0 16px 16px 32px; display: grid; gap: 14px; font-size: 14px; }
.deep h4 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.deep ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.deep .claim { font-weight: 600; }
.deep .claim + ul { margin-top: 4px; font-weight: 400; color: var(--muted); }
.deep .cmp li { list-style: none; margin-left: -18px; display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; white-space: nowrap; margin-top: 2px; }
.tag.conflict { background: var(--down-soft); color: var(--down); }
.tag.support { background: var(--flat-soft); color: var(--ink); }
.tag.confirm { background: var(--up-soft); color: var(--up); }
.tag.note { background: var(--warn-soft); color: var(--warn); }
.deep .who2 { font-weight: 600; }
.subhead { font-size: 15px; font-weight: 600; margin-top: 6px; }

footer { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }

@media (max-width: 520px) {
  .mast h1 { font-size: 22px; }
  .stance-cols { grid-template-columns: 1fr; }
  .sides { grid-template-columns: 1fr; }
  .day { grid-template-columns: 54px 1fr; }
}
@media (prefers-reduced-motion: reduce) { summary .chev { transition: none; } }
</style>

      B.rows.map(function (r) {
        var t = '', rng = [];

  if (D.deep) {
    var tagCls = function (t) { return /상충/.test(t) ? 'conflict' : /확인|일치/.test(t) ? 'confirm' : /보완/.test(t) ? 'support' : 'note'; };
    var cmpList = function (arr) { return '<ul class="cmp">' + arr.map(function (c) { return '<li><span class="tag ' + tagCls(c.tag) + '">' + esc(c.tag) + '</span><span><span class="who2">' + esc(c.who) + '</span> — ' + esc(c.text) + (c.src ? ' ' + links(c.src) : '') + '</span></li>'; }).join('') + '</ul>'; };
    var bullets = function (arr) { return '<ul>' + arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; };
    h.push('<section><h2>깊이 읽기 · 증권사 리포트</h2><div class="deep">' + D.deep.reports.map(function (r, i) {
      return '<details' + (i === 0 ? ' open' : '') + '><summary><span class="bar" style="background:' + SC[r.s] + '"></span><span class="t"><b>' + esc(r.b) + ' · ' + esc(r.a) + '</b><span>「' + esc(r.t) + '」</span><span>' + esc(r.why) + '</span></span><span class="chev" aria-hidden="true">▶</span></summary><div class="body">' +
        '<div><h4>배경</h4>' + bullets(r.bg) + '</div>' +
        '<div><h4>애널리스트의 주장과 근거</h4><ul>' + r.claims.map(function (c) { return '<li><span class="claim">' + esc(c.c) + '</span>' + bullets(c.e) + '</li>'; }).join('') + '</ul></div>' +
        '<div><h4>다른 자료와 비교</h4>' + cmpList(r.cmp) + '</div></div></details>';
    }).join('') + '</div></section>');
    h.push('<section><h2>깊이 읽기 · 외신</h2><p class="why">FT·WSJ·Economist 공개 RSS의 제목·요약 기준. 기사 본문은 링크에서 확인.</p><div class="deep">' + D.deep.news.map(function (n) {
      return '<details><summary><span class="bar" style="background:var(--accent)"></span><span class="t"><b>' + esc(n.t) + '</b><span>' + esc(n.src) + '</span></span><span class="chev" aria-hidden="true">▶</span></summary><div class="body">' +
        '<div><h4>배경</h4>' + bullets(n.bg) + '</div>' +
        '<div><h4>기사 요지</h4>' + bullets(n.pts) + '<div class="ev" style="margin-top:6px">' + links(n.links) + '</div></div>' +
        '<div><h4>리포트와 비교</h4>' + cmpList(n.cmp) + '</div></div></details>';
    }).join('') + '</div></section>');
  }

  h.push('<footer><span>' + esc(D.sources) + '</span><span>요약은 리포트 원문을 의역한 것입니다. 투자 판단의 근거로 쓰기 전에 원문을 확인하세요.</span></footer>');

  document.getElementById('app').innerHTML = h.join('');
})();
</script>
