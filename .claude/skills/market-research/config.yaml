# FnGuide 리서치 수집 설정.
# 로그인 정보는 환경 변수 FNGUIDE_ID / FNGUIDE_PW 에서 읽는다 (저장소에 적지 않는다).
# 로그인 절차(/Users/UserLogin, RSA-OAEP 암호화)는 collect.py 에 구현되어 있다.

# 매일 읽을 카테고리: 리서치 > 주식 > 주식시황 / 주식전략.
# list_url 과 selectors 는 로그인 후 실제 페이지에서 확인해 채운다.
# 비어 있으면 collect.py 가 --discover 모드처럼 페이지 스냅샷만 남긴다.
categories:
  - id: market
    name: 주식시황
    list_url: https://www.fnguide.com/Research/SearchReport
    selectors: {}
  - id: strategy
    name: 주식전략
    list_url: https://www.fnguide.com/Research/SearchReport
    selectors: {}
# selectors 키: row, date, title, broker, analyst, link (각각 CSS selector, row 기준 상대경로)
